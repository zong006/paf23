<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Details</title>
</head>
<body>
    <a href="/search" th:href="@{/search}">Go back to listings</a> 
    <table>
        <tr>
            <th>Id</th>
            <td th:text="${session.result._id}"></td>
        </tr>
        <tr>
            <th>
                Description
            </th>
            <td th:text="${session.result.description}"></td>
            <td>
                <img th:src="@{${session.result.images.picture_url}}" width="100" height="100">
            </td>
        </tr>
        <tr>
            <th>Address</th>
            <td>
                <p th:text="${session.result.address.street}"></p>
                <p th:text="${session.result.address.suburb}"></p>
                <p th:text="${session.result.address.country}"></p>
            </td>
        </tr>

        <tr>
            <th>Amenities</th>
            <td th:text="${session.result.amenities}"></td>
        </tr>
    </table>
    <br>
    <br>

    <h2>Bookings</h2>
    <span th:if="${errorMessage != null}" th:text=${errorMessage}></span>
    <br>
    <br>
    <div>
        <form th:action="@{/booking}" method="post" th:object="${booking}">
            <div>
                <label for="name">Name </label>
                <input type="text" id="name" th:field="*{name}">
            </div>
            <br>
            <div>
                <label for="email">Email </label>
                <input type="text" id="email" th:field="*{email}">
            </div>
            <br>
            <div>
                <label for="bookingDate">Arrival </label>
                <input type="date" id="bookingDate" th:field="*{bookingDate}">
            </div>
            <br>
            <div>
                <label for="duration">Stay (days) </label>
                <input type="number" id="duration" th:field="*{duration}" >
            </div>
            <br>
            <div>
                <input type="hidden" name="_id" th:value="${session.result._id}">
                <input type="submit" value="Book">
            </div>
        </form>
    </div>

</body>
</html>
